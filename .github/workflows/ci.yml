name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # The repo is private, so a hung e2e server would burn Actions minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: bun run check
        run: bun run check
      - name: bun test
        run: bun test
      - name: bun run build
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # e2e signs in with test session cookies and catches the request to
      # Google (e2e/auth.e2e.ts), so placeholders stand in for the secrets.
      - name: Write placeholder .dev.vars
        run: |
          sed -E 's/^([A-Z_]+)=$/\1=ci-placeholder-value-at-least-32-characters/' .dev.vars.example \
            | sed 's#^BETTER_AUTH_URL=.*#BETTER_AUTH_URL=http://localhost:5173#' > .dev.vars
      - name: bun run e2e
        run: bun run e2e
