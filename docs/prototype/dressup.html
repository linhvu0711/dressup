<meta name="theme-color" content="#FBFAF8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFAF8;--fg:#1A1917;--card:#FFFFFF;--muted:#F1EFEA;--muted-fg:#6E6A62;--border:#E6E2DA;--primary:#1A1917;--primary-fg:#FBFAF8;--danger:#B42318;--ring:rgba(26,25,23,.45);
  --shadow:0 18px 40px -12px rgba(40,32,20,.22),0 2px 6px rgba(40,32,20,.06);--lift:0 2px 10px rgba(40,32,20,.16);--ease:cubic-bezier(.16,1,.3,1);
  --wall:linear-gradient(90deg,#C6C2BC 0%,#DAD6D0 40%,#D3CFC9 70%,#C3BFB9 100%);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;color-scheme:light}
:root[data-theme=dark]{--bg:#121110;--fg:#F4F1EA;--card:#1B1A18;--muted:#262421;--muted-fg:#A9A49A;--border:#302D29;--primary:#F4F1EA;--primary-fg:#161513;--danger:#F97066;--ring:rgba(244,241,234,.5);
  --shadow:0 18px 44px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;caret-color:var(--fg);overflow:hidden}
::selection{background:var(--fg);color:var(--bg)}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.soft{color:var(--muted-fg)}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.005em}

#app{position:relative;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
body.framed{background:var(--muted);display:flex;align-items:center;justify-content:center}
body.framed #app{width:390px;height:min(844px,calc(100dvh - 32px));border:1px solid var(--border);border-radius:32px;box-shadow:var(--shadow)}

/* buttons */
.btn{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .15s,opacity .15s}
.btn:hover:not(:disabled){background:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.primary:hover:not(:disabled){opacity:.86;background:var(--primary)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover:not(:disabled){background:var(--danger);opacity:.86}
.btn.big{height:46px;padding:0 20px;font-size:14.5px}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;flex:none;transition:background .15s,opacity .15s}
.ib:hover:not(:disabled){background:var(--muted)}
.ib.danger{color:var(--danger)}
.ib.sm{width:32px;height:32px}
.ib.lg{width:44px;height:44px}
.ib.on,.ib.on:hover:not(:disabled){background:var(--muted)}
.ib.primary,.ib.primary:hover:not(:disabled){background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.ib.primary:hover:not(:disabled){opacity:.86}
.ic{display:block;flex:none}

/* top bar (laptop) + bottom bar (phone) */
.top{height:60px;flex:none;display:flex;align-items:center;gap:28px;padding:0 24px;border-bottom:1px solid var(--border)}
.word{font-family:var(--serif);font-weight:400;font-size:27px;letter-spacing:-.01em;line-height:1}
.tnav{display:flex;gap:22px;align-self:stretch}
.tnav button{padding:0 2px;font-weight:500;color:var(--muted-fg);display:flex;align-items:center;gap:7px;transition:color .15s}
.tnav button:hover{color:var(--fg)}
.tnav button.on{color:var(--fg);box-shadow:inset 0 -1.5px 0 var(--fg)}
.top .sp{flex:1}
.nav{flex:none;display:flex;border-top:1px solid var(--border);background:var(--bg)}
.nav button{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted-fg);transition:color .15s}
.nav button.on{color:var(--fg)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.hd{flex:none;display:flex;align-items:center;gap:12px;padding:14px 16px 8px;font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.01em;line-height:1.1;min-height:62px}
.wide .hd{padding:18px 24px 8px}
.hd .sp{flex:1}
.hd .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .note{font-family:var(--sans);font-size:13px;color:var(--muted-fg)}
.scroll{flex:1;min-height:0;overflow:auto}

/* stage: the wall is light in both themes, so the things on it keep light colours */
.stage{--card:#FFFFFF;--fg:#1A1917;--muted:#F1EFEA;--border:rgba(26,25,23,.1);--primary:#1A1917;--primary-fg:#FBFAF8;--ring:rgba(26,25,23,.5);color:var(--fg);
  position:relative;background:var(--wall);overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
.stage>svg,.stage>#fig>svg{height:100%;width:auto;max-width:none;overflow:visible;flex:none}
.stage .tl{position:absolute;top:12px;left:12px;display:flex;gap:8px;align-items:center;max-width:calc(100% - 80px)}
.stage .tr{position:absolute;top:12px;right:12px}
.stage .ib{background:var(--card);box-shadow:var(--lift);border-color:transparent}
.stage .ib:hover:not(:disabled){background:var(--muted)}
.stage .ib.primary,.stage .ib.primary:hover:not(:disabled){background:var(--primary)}
.editbar{height:36px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:6px;padding:0 5px 0 14px;font-size:12.5px;font-weight:500;box-shadow:var(--lift);min-width:0}
.editbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editbar button{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.editbar button:hover{background:var(--muted)}
.ph svg{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.skel{background:var(--muted);border-radius:12px;animation:pulse 1.4s ease-in-out infinite}

/* dress: phone */
.narrow .dress{flex:1;min-height:0;display:flex;flex-direction:column}
.narrow .dress .stage{flex:0 0 46%;border-radius:0 0 24px 24px}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px 0;gap:10px}
.seg{display:flex;background:var(--muted);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{flex:1;height:32px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted-fg);transition:color .15s}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(40,32,20,.16)}
.seg.sm{display:inline-flex;padding:2px}
.seg.sm button{height:26px;padding:0 11px;font-size:12px;flex:none}
.rowhead{display:flex;align-items:center;min-height:34px;font-size:13px;margin:-2px 0 -8px;flex:none}
.rowhead .sp{flex:1}
/* dress: laptop */
.wide .dress{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,372px) minmax(0,1fr) minmax(300px,372px);grid-template-rows:minmax(0,1fr)}
.wide .dress .col{min-height:0;display:flex;flex-direction:column;padding:20px 24px 0;gap:14px}
.wide .dress>.stage{margin:16px 0;border-radius:26px}
.coltitle{font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:-.01em;display:flex;align-items:center;min-height:34px;line-height:1}
.coltitle .sp{flex:1}

/* mode cards */
.scroll[data-sc=modes],.scroll[data-sc=rows]{margin:0 -6px;padding:0 6px}
.mcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;padding:5px 0 18px}
.wide .mcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.mcard{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.pic{display:block;position:relative;border-radius:14px;overflow:hidden;background:#D3CFC9;aspect-ratio:2/3;width:100%;transition:filter .2s}
.pic svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mcard:hover .pic,.lcard:hover .pic{filter:brightness(1.03)}
.mcard.on .pic,.lcard.on .pic{outline:2px solid var(--fg);outline-offset:2.5px}
.mcard .nm{font-size:12px;line-height:1.3;font-weight:500;color:var(--muted-fg)}
.mcard.on .nm{color:var(--fg)}
.badge{position:absolute;left:7px;bottom:7px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(26,25,23,.78);color:#fff}

/* colour rows */
.grow{display:flex;flex-direction:column;gap:10px;padding:14px 0 16px;border-bottom:1px solid var(--border)}
.grow:last-child{border-bottom:0}
.gtop{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;min-height:30px}
.gtop .hex{font-size:12px;color:var(--muted-fg);font-weight:400}
.gtop .sp{flex:1}
.sws{display:flex;gap:11px;flex-wrap:wrap;align-items:center;padding:3px 0}
.sw{width:34px;height:34px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(110,106,98,.38);position:relative;flex:none;transition:transform .15s var(--ease)}
.sw:hover{transform:scale(1.07)}
.sw.cur{outline:2px solid var(--fg);outline-offset:2.5px}
.sw .rm{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
:root[data-theme=dark] .sw{box-shadow:inset 0 0 0 1px rgba(244,241,234,.3)}
.stage .sw,:root[data-theme=dark] .stage .sw{box-shadow:inset 0 0 0 1px rgba(110,106,98,.38)}
.sw.plus{box-shadow:none;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted-fg)}
.sw.plus:hover{border-color:var(--muted-fg);color:var(--fg)}
.sw.sm{width:16px;height:16px;border-radius:5px}

/* looks */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 12px;flex:none;scrollbar-width:none}
.wide .chips{padding:2px 24px 14px}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--border);font-size:12.5px;font-weight:500;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;background:transparent;transition:background .15s}
.chip:hover{background:var(--muted)}
.chip.on,.chip.on:hover{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chip.icon{padding:0;width:32px;justify-content:center;border-style:dashed;color:var(--muted-fg)}
.chip.icon:hover{color:var(--fg)}
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding:5px 16px 96px}
.wide .wall{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:26px 18px;padding:5px 24px 96px}
.lcard{display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0;position:relative}
.lcard .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.lcard .tg{font-size:12px;color:var(--muted-fg);margin-top:-5px;min-height:17px}
.ck{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;border:1.5px solid #fff;background:rgba(26,25,23,.22);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lcard.on .ck{background:#1A1917}
.float{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;z-index:5;box-shadow:var(--shadow)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px 24px}
.empty h3{font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.01em}
.empty p{color:var(--muted-fg);max-width:30ch;text-wrap:balance}
.empty .btn{margin-top:8px}
.wide .looks{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:minmax(0,1fr)}
.wide .looks .left{min-height:0;display:flex;flex-direction:column;position:relative}
.wide .looks .right{border-left:1px solid var(--border);min-height:0;display:flex;flex-direction:column}
.narrow .looks{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* look detail */
.detail{display:flex;flex-direction:column;min-height:0;flex:1}
.detail .stage{flex:0 0 52%}
.narrow .detail .stage{border-radius:24px;margin:0 12px}
.wide .detail .stage{flex:0 0 50%;margin:16px 16px 0;border-radius:22px}
.dinfo{padding:16px 18px 22px;display:flex;flex-direction:column;gap:12px}
.wide .dinfo{padding:18px 24px 24px}
.dinfo h2{font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.01em;line-height:1.1}
.dhead{display:flex;align-items:flex-start;gap:8px}
.dhead .sp{flex:1}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 11px;border-radius:999px;background:var(--muted);font-weight:500}
.crow{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--border)}
.crow:last-child{border-bottom:0}
.crow .sp{flex:1}
.crow .sw{cursor:default;width:28px;height:28px;border-radius:8px}
.crow .sw:hover{transform:none}
.code{font-size:12.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--border);transition:background .15s}
.code:hover{background:var(--muted)}

/* compare */
.cmp{flex:1;min-height:0;display:flex;align-items:flex-start;gap:12px;padding:4px 16px 16px;overflow:auto;scroll-snap-type:x mandatory}
.cmp .cc{flex:0 0 42%;display:flex;flex-direction:column;gap:7px;min-width:0;scroll-snap-align:start}
.wide .cmp{padding:8px 24px 24px;gap:16px;justify-content:center}
.wide .cmp .cc{flex:1 1 0;max-width:calc((100dvh - 210px)*.329)}
.cmp .stage{flex:none;width:100%;aspect-ratio:260/790;border-radius:16px}
.cmp .stage>svg{width:100%;height:100%}
.cmp .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.cmp .mini{display:flex;gap:5px}

/* settings */
.set{max-width:560px;width:100%;margin:0 auto;padding:6px 18px 44px;display:flex;flex-direction:column}
.sec{font-size:12.5px;font-weight:500;color:var(--muted-fg);margin:26px 0 6px}
.srow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);min-height:58px;min-width:0}
.srow .sp{flex:1}
.srow .em{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow small{display:block;font-size:12px;color:var(--muted-fg)}
.srow .acts{display:flex;gap:8px;flex:none}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.rowbtn .sw:hover{transform:none}
.prev{width:104px;aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative;background:#D3CFC9;flex:none}
.prev svg{position:absolute;inset:0;width:100%;height:100%}
.mann{display:flex;gap:18px;align-items:center}
.mann .rows{flex:1;min-width:0}
.field{display:flex;gap:8px;margin-top:4px;align-items:center}
.inp{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:0 13px;font-size:14px;transition:border-color .15s}
.inp::placeholder{color:var(--muted-fg)}
.inp:hover{border-color:var(--muted-fg)}
.inp:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.inp.bad{border-color:var(--danger)}
.hint{font-size:12.5px;color:var(--muted-fg);min-height:18px;margin-top:7px}
.hint.bad{color:var(--danger)}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(20,18,14,.42);z-index:20}
.scrim.clear{background:transparent}
.sheet{position:absolute;z-index:21;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;padding:20px;max-height:88%;overflow:auto}
.narrow .sheet{left:0;right:0;bottom:0;border-radius:26px 26px 0 0;border-bottom:0;padding-bottom:22px}
.wide .sheet{left:50%;top:50%;transform:translate(-50%,-50%);width:430px;border-radius:22px;padding:24px}
.wide .sheet.picker{left:auto;right:24px;top:84px;transform:none;width:324px;padding:20px}
.sheet.enter{animation:rise .28s var(--ease)}
.wide .sheet.enter{animation:pop .24s var(--ease)}
.wide .sheet.picker.enter{animation:popr .24s var(--ease)}
@keyframes rise{from{transform:translateY(28px);opacity:0}}
@keyframes pop{from{transform:translate(-50%,-48%) scale(.985);opacity:0}}
@keyframes popr{from{transform:translateY(8px);opacity:0}}
.sheet h3{font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:-.01em;line-height:1.1}
.sheet .sub{color:var(--muted-fg);font-size:13.5px;margin-top:-8px}
.sheet label{font-size:12.5px;font-weight:500;display:block;margin-bottom:7px;color:var(--muted-fg)}
.acts2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}
.narrow .acts2 .btn{flex:1}
.sv{position:relative;height:156px;border-radius:14px;cursor:crosshair;touch-action:none;
  background:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,hsl(var(--h) 100% 50%));box-shadow:inset 0 0 0 1px rgba(110,106,98,.35)}
.hue{position:relative;height:14px;border-radius:999px;cursor:pointer;touch-action:none;
  background:linear-gradient(to right,#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00);box-shadow:inset 0 0 0 1px rgba(110,106,98,.35)}
.knob{position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}
.hue .knob{top:50%}
.hexrow{display:flex;gap:10px;align-items:center}
.hexrow .sw{width:40px;height:40px;border-radius:12px;cursor:default}
.hexrow .sw:hover{transform:none}
.hexrow .inp{font-family:var(--mono);text-transform:uppercase}
.trow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);min-height:54px}
.trow .sp{flex:1}
.trow small{color:var(--muted-fg);font-size:12px}
.trow .inp{height:36px}

/* toast + not saved bar */
#toast{position:absolute;left:50%;bottom:82px;transform:translate(-50%,10px);background:var(--fg);color:var(--bg);font-size:13px;font-weight:500;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .28s var(--ease);z-index:40;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
.unsaved{flex:none;display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--danger);color:#fff;font-size:13px;font-weight:500}
.unsaved .sp{flex:1}
.unsaved button{height:28px;padding:0 13px;border-radius:999px;background:#fff;color:#1A1917;font-weight:600;font-size:12.5px}

/* sign-in */
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px}
.gate .word{font-size:76px;letter-spacing:-.02em}
.gate h3{font-family:var(--serif);font-size:28px;font-weight:400}
.gate p{color:var(--muted-fg);max-width:32ch;text-wrap:balance;font-size:15px}
.gate .btn{margin-top:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* StatePanel - floating, draggable, collapsible control panel for prototype states.
 * Inline this whole file in a <script> tag inside the prototype (artifacts cannot load local scripts).
 *
 * Usage:
 *   StatePanel.init({
 *     rows: [
 *       { id: 'table', label: 'Table',  options: ['loaded', 'loading', 'empty', 'error'] },
 *       { id: 'toast', label: 'Toast',  options: ['none', 'success', 'error'] },
 *       { id: 'theme', label: 'Theme',  options: ['light', 'dark'], value: 'dark' },
 *     ],
 *     onChange(state, changedId) { render(state) },   // called once at init and after every change
 *   })
 *   StatePanel.set('toast', 'success')   // the prototype can drive a row (e.g. after a Save click)
 *   StatePanel.get()                     // { table: 'loaded', toast: 'none', theme: 'dark' }
 *
 * Every row is independent. First option is the default unless `value` is given.
 * Drag by the header. Collapse button folds it to a pill. Reset restores defaults.
 * Backtick (`) hides/shows the panel so it stays out of screenshots.
 */
window.StatePanel = (function () {
  var KEY = 'prototype-state-panel'
  var rows = [], state = {}, defaults = {}, onChange = function () {}
  var root, body, pill, hidden = false, collapsed = false

  var css = [
    '#sp-root{position:fixed;top:16px;right:16px;z-index:2147483000;width:280px;max-height:calc(100vh - 32px);',
    'display:flex;flex-direction:column;background:#1c1c1e;color:#f2f2f2;border:1px solid #3a3a3c;border-radius:10px;',
    'box-shadow:0 8px 24px rgba(0,0,0,.35);font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;',
    'user-select:none;-webkit-user-select:none;overflow:hidden}',
    '#sp-root *{box-sizing:border-box;font:inherit;color:inherit}',
    '#sp-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#2c2c2e;cursor:grab;border-bottom:1px solid #3a3a3c}',
    '#sp-head.sp-dragging{cursor:grabbing}',
    '#sp-title{flex:1;font-weight:600;letter-spacing:.02em}',
    '#sp-head button{background:#3a3a3c;border:0;border-radius:6px;padding:3px 8px;cursor:pointer;line-height:1.2}',
    '#sp-head button:hover{background:#48484a}',
    '#sp-body{overflow:auto;padding:8px 10px 10px}',
    '.sp-row{margin:0 0 8px}.sp-row:last-child{margin:0}',
    '.sp-label{display:block;margin:0 0 4px;color:#a1a1a6;font-size:11px;text-transform:uppercase;letter-spacing:.06em}',
    '.sp-opts{display:flex;flex-wrap:wrap;gap:4px}',
    '.sp-opt{background:#2c2c2e;border:1px solid #3a3a3c;border-radius:6px;padding:3px 8px;cursor:pointer}',
    '.sp-opt:hover{background:#3a3a3c}',
    '.sp-opt.sp-on{background:#0a84ff;border-color:#0a84ff;color:#fff}',
    '#sp-root.sp-collapsed{width:auto}#sp-root.sp-collapsed #sp-body{display:none}',
    '#sp-root.sp-collapsed #sp-head{border-bottom:0}#sp-root.sp-collapsed #sp-reset{display:none}',
    '#sp-root.sp-hidden{display:none}',
  ].join('')

  function h(tag, attrs, children) {
    var el = document.createElement(tag)
    for (var k in attrs || {}) {
      if (k === 'text') el.textContent = attrs[k]
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k])
      else el.setAttribute(k, attrs[k])
    }
    ;(children || []).forEach(function (c) { el.appendChild(c) })
    return el
  }

  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') } catch (e) { return {} } }
  function save(patch) {
    try {
      var cur = load(); for (var k in patch) cur[k] = patch[k]
      localStorage.setItem(KEY, JSON.stringify(cur))
    } catch (e) {}
  }

  function renderRows() {
    body.innerHTML = ''
    rows.forEach(function (row) {
      var opts = row.options.map(function (opt) {
        return h('button', {
          class: 'sp-opt' + (state[row.id] === opt ? ' sp-on' : ''),
          type: 'button',
          text: opt,
          onclick: function () { set(row.id, opt) },
        })
      })
      body.appendChild(h('div', { class: 'sp-row' }, [
        h('span', { class: 'sp-label', text: row.label || row.id }),
        h('div', { class: 'sp-opts' }, opts),
      ]))
    })
    pill.textContent = collapsed ? '\u25B8' : '\u25BE'
  }

  function set(id, value, silent) {
    if (!(id in state) || state[id] === value) return
    state[id] = value
    renderRows()
    if (!silent) onChange(get(), id)
  }

  function get() { var out = {}; for (var k in state) out[k] = state[k]; return out }

  function reset() {
    var changed = false
    for (var k in defaults) if (state[k] !== defaults[k]) { state[k] = defaults[k]; changed = true }
    renderRows()
    if (changed) onChange(get(), null)
  }

  function setCollapsed(v) { collapsed = v; root.classList.toggle('sp-collapsed', v); save({ collapsed: v }); renderRows() }
  function setHidden(v) { hidden = v; root.classList.toggle('sp-hidden', v) }

  function clamp() {
    var r = root.getBoundingClientRect()
    var x = Math.min(Math.max(0, r.left), Math.max(0, window.innerWidth - r.width))
    var y = Math.min(Math.max(0, r.top), Math.max(0, window.innerHeight - r.height))
    root.style.left = x + 'px'; root.style.top = y + 'px'; root.style.right = 'auto'
    return { x: x, y: y }
  }

  function drag(head) {
    var sx, sy, ox, oy, moving = false
    head.addEventListener('pointerdown', function (e) {
      if (e.target.tagName === 'BUTTON') return
      var r = root.getBoundingClientRect()
      sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; moving = true
      root.style.left = ox + 'px'; root.style.top = oy + 'px'; root.style.right = 'auto'
      head.classList.add('sp-dragging')
      head.setPointerCapture(e.pointerId)
    })
    head.addEventListener('pointermove', function (e) {
      if (!moving) return
      root.style.left = (ox + e.clientX - sx) + 'px'
      root.style.top = (oy + e.clientY - sy) + 'px'
    })
    function end(e) {
      if (!moving) return
      moving = false
      head.classList.remove('sp-dragging')
      try { head.releasePointerCapture(e.pointerId) } catch (_) {}
      save(clamp())
    }
    head.addEventListener('pointerup', end)
    head.addEventListener('pointercancel', end)
  }

  function init(cfg) {
    rows = cfg.rows || []
    onChange = cfg.onChange || onChange
    state = {}; defaults = {}
    rows.forEach(function (r) { defaults[r.id] = state[r.id] = ('value' in r) ? r.value : r.options[0] })

    document.head.appendChild(h('style', { text: css }))
    pill = h('button', { type: 'button', title: 'Collapse / expand', onclick: function () { setCollapsed(!collapsed) } })
    var head = h('div', { id: 'sp-head' }, [
      h('span', { id: 'sp-title', text: cfg.title || 'States' }),
      h('button', { id: 'sp-reset', type: 'button', text: 'Reset', onclick: reset }),
      pill,
    ])
    body = h('div', { id: 'sp-body' })
    root = h('div', { id: 'sp-root' }, [head, body])
    document.body.appendChild(root)

    var saved = load()
    if (typeof saved.x === 'number') { root.style.left = saved.x + 'px'; root.style.top = saved.y + 'px'; root.style.right = 'auto' }
    collapsed = !!saved.collapsed
    root.classList.toggle('sp-collapsed', collapsed)
    drag(head)
    window.addEventListener('resize', clamp)
    document.addEventListener('keydown', function (e) {
      if (e.key === '`' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) setHidden(!hidden)
    })
    renderRows()
    clamp()
    onChange(get(), null)
  }

  return { init: init, set: set, get: get, reset: reset, hide: function () { setHidden(true) }, show: function () { setHidden(false) } }
})()

const ln  =(d,op=.3,w=1,dash='')=>`<path d="${d}" fill="none" stroke="#0A0A14" stroke-width="${w}" opacity="${op}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
const cyl =(x,y,w,h,op=1)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#cyl)" opacity="${op}"/>`;
const btn =(x,y,r=3)=>`<circle cx="${x}" cy="${y+.8}" r="${r}" fill="#000" opacity=".25"/><circle cx="${x}" cy="${y}" r="${r}" fill="#EDEAE4" stroke="rgba(0,0,0,.45)" stroke-width=".7"/><circle cx="${x-.9}" cy="${y}" r=".5" fill="#555"/><circle cx="${x+.9}" cy="${y}" r=".5" fill="#555"/>`;
// one garment piece: flat exact colour + shading clipped to the shape + fabric grain + soft edge
function piece(d,col,inner='',opt={}){
  const id='c'+(uid++);
  return `<clipPath id="${id}"><path d="${d}"/></clipPath>
  <g clip-path="url(#${id})"><rect width="400" height="820" fill="${col}"/>${inner}${(opt.grain===false||LITE)?'':`<rect width="400" height="820" filter="url(#grain)" style="mix-blend-mode:soft-light" opacity="${opt.grain||.16}"/>`}</g>
  <path d="${d}" fill="none" stroke="${opt.stroke||'rgba(8,8,16,.36)'}" stroke-width="1" stroke-linejoin="round"/>`;
}
const arm = s => `<g transform="rotate(-3.4 130 178)">${s}</g>`;
const layer = s => `<g filter="url(#lay)">${s}</g>`;
function scallop(pts,b){ let s=''; for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy); s+=` Q ${((x0+x1)/2+dy/L*b).toFixed(1)} ${((y0+y1)/2-dx/L*b).toFixed(1)} ${x1} ${y1}`; } return s; }

  <pattern id="twill" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="5" fill="#000" fill-opacity=".035"/></pattern>

    const body=S.dressTab==='mode'?modePicker():`<div class="rowhead"><span class="soft">${esc(M[S.mode].name)}</span>${rowsHead()}</div>${colourRows()}`;
    return `<div class="dress">${stage()}<div class="panel"><div class="seg" role="tablist"><button role="tab" aria-selected="${S.dressTab==='mode'}" class="${S.dressTab==='mode'?'on':''}" data-act="dressTab" data-arg="mode">Mode</button><button role="tab" aria-selected="${S.dressTab==='colours'}" class="${S.dressTab==='colours'?'on':''}" data-act="dressTab" data-arg="colours">Colours</button></div>${body}</div></div>`;
  }
  return `<div class="dress"><div class="col"><div class="coltitle">Mode</div>${modePicker()}</div>${stage()}<div class="col"><div class="coltitle">Colours${rowsHead()}</div>${colourRows()}</div></div>`;
}
function filtered(){
  if(P.looks!=='loaded') return [];
  const f=S.filter;
  return S.looks.filter(l=>f==='All'||M[l.mode].w===f||l.tags.includes(f));
}
function chips(){
  const all=['All','Hot','Cool','Cold',...S.tags];
  return `<div class="chips" data-sc="chips">${all.map(c=>`<button class="chip${S.filter===c?' on':''}" data-act="chip" data-arg="${esc(c)}">${esc(c)}</button>`).join('')}<button class="chip icon" data-act="tagsOpen" aria-label="Edit tags" title="Edit tags">${I(IC.pen,14)}</button></div>`;
}
function wall(){
  if(P.looks==='loading') return `<div class="scroll"><div class="wall">${Array(6).fill('<div class="lcard"><div class="pic skel"></div><div class="skel" style="height:14px;width:70%"></div></div>').join('')}</div></div>`;
  if(P.looks==='empty'||!S.looks.length) return `<div class="empty"><h3>No looks yet</h3><p>Dress the mannequin, then tap the bookmark button. Your looks come here.</p><button class="btn primary" data-act="nav" data-arg="dress">Go to Dress</button></div>`;
  const list=filtered();
  if(!list.length) return `<div class="empty"><h3>No looks here</h3><p>No saved look has "${esc(S.filter)}".</p><button class="btn" data-act="chip" data-arg="All">Show all</button></div>`;
  return `<div class="scroll" data-sc="wall"><div class="wall">${list.map(l=>{
    const on=S.picking?S.picked.includes(l.id):(!narrow&&S.sel===l.id);
    return `<button class="lcard${on?' on':''}" data-act="openLook" data-arg="${l.id}" aria-pressed="${on}"><span class="pic">${lookFig(l,{vb:CROP,lite:true})}</span>${S.picking?`<span class="ck">${S.picked.includes(l.id)?I(IC.check,14):''}</span>`:''}<span class="nm">${esc(lookName(l))}</span><span class="tg">${esc(l.tags.join(', '))}</span></button>`}).join('')}</div></div>`;
}
function looksHead(){
  const can=P.looks==='loaded'&&S.looks.length>1;
  if(S.picking) return `<div class="hd">${ib('x','pickStop','Stop picking')}<span>${S.picked.length} picked</span><span class="sp"></span><span class="note">Pick 2 to 6</span></div>`;
  return `<div class="hd">${narrow?ib('gear','settings','Settings'):''}<span>Looks</span><span class="sp"></span><button class="ib" data-act="pickStart" aria-label="Compare" title="Compare"${can?'':' disabled'}>${I(IC.scale)}</button></div>`;
}
function detail(l,page){
  if(!l) return `<div class="empty"><p>Click a look to see it here.</p></div>`;
  const items=[...M[l.mode].items].reverse();
  return `<div class="detail">${page?`<div class="hd">${ib('back','back','Back')}<span class="ttl">${esc(lookName(l))}</span><span class="sp"></span>${ib('pen','lookEdit','Edit this look','',l.id)}${ib('bin','lookDel','Delete this look','danger',l.id)}</div>`:''}
    <div class="stage">${lookFig(l)}</div>
    <div class="scroll"><div class="dinfo">
      ${page?'':`<div class="dhead"><div><h2>${esc(lookName(l))}</h2></div><span class="sp"></span>${ib('pen','lookEdit','Edit this look','',l.id)}${ib('bin','lookDel','Delete this look','danger',l.id)}</div>`}
      <div class="soft" style="margin-top:-6px">${esc(M[l.mode].name)} · ${M[l.mode].w}</div>
      ${l.tags.length?`<div class="tags">${l.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      <div>${items.map(g=>`<div class="crow"><span class="sw" style="background:${l.colors[g]}"></span><span>${G[g]}${JACKET[g]?` <span class="soft">· ${l.open[g]!==false?'open':'closed'}</span>`:''}</span><span class="sp"></span><button class="code mono" data-act="copy" data-arg="${l.colors[g]}" aria-label="Copy ${l.colors[g]}" title="Copy">${l.colors[g]}</button></div>`).join('')}</div>
    </div></div></div>`;
}
function pageLooks(){
  const float=S.picking&&S.picked.length>=2?`<button class="btn primary pill big float" data-act="compareGo">${I(IC.scale)} Compare ${S.picked.length}</button>`:'';
  if(narrow) return `<div class="looks">${looksHead()}${chips()}${wall()}${float}</div>`;
  const list=filtered(); const sel=list.find(l=>l.id===S.sel)||list[0];
  return `<div class="looks"><div class="left">${looksHead()}${chips()}${wall()}${float}</div><div class="right">${detail(sel,false)}</div></div>`;
}
function pageCompare(){
  const ls=S.picked.map(byId).filter(Boolean);
  return `<div class="hd">${ib('back','back','Back')}<span>Compare</span><span class="sp"></span><span class="note">${ls.length} looks${narrow&&ls.length>2?' · swipe sideways':''}</span></div>
    <div class="cmp" data-sc="cmp">${ls.map(l=>`<div class="cc"><div class="stage">${lookFig(l,{vb:'70 14 260 790'})}</div><div class="nm">${esc(lookName(l))}</div><div class="mini">${[...M[l.mode].items].reverse().map(g=>`<span class="sw sm" style="background:${l.colors[g]}" title="${G[g]} ${l.colors[g]}"></span>`).join('')}</div></div>`).join('')}</div>`;
}
function pageSettings(){
  return `<div class="hd">${ib('back','back','Back')}<span>Settings</span></div><div class="scroll" data-sc="set"><div class="set">
    <div class="sec" style="margin-top:6px">Mannequin</div>
    <div class="mann"><div class="prev" id="prev">${figure(['tee_s'],{tee_s:'#F3F1EC'},{vb:'90 20 220 220',lite:true})}</div><div class="rows">
      <div class="srow"><button class="rowbtn" data-act="pickFor" data-arg="skin"><span>Skin colour</span><span class="sp" style="flex:1"></span><span class="mono soft" style="font-size:12.5px">${S.skin}</span><span class="sw" style="background:${S.skin}"></span></button></div>
      <div class="srow"><button class="rowbtn" data-act="pickFor" data-arg="hair"><span>Hair colour</span><span class="sp" style="flex:1"></span><span class="mono soft" style="font-size:12.5px">${S.hair}</span><span class="sw" style="background:${S.hair}"></span></button></div>
    </div></div>
    <div class="sec">Account</div>
    <div class="srow"><div class="em">you@example.com<small>Signed in with Google</small></div><span class="sp"></span><button class="btn" data-act="signOut">Sign out</button></div>
    <div class="srow"><div class="em">Delete my account<small>Your looks and colours go away for good.</small></div><span class="sp"></span>${ib('bin','accountDel','Delete my account','danger')}</div>
  </div></div>`;
}
function gate(){
  if(P.access==='sign-ups closed') return `<div class="gate"><div class="word">dressup</div><h3>No new accounts for now</h3><p>The app is full at the moment. If you have an account, you can sign in.</p><button class="btn primary big" data-act="signIn">${I(IC.g)} Sign in with Google</button></div>`;
  return `<div class="gate"><div class="word">dressup</div><p>See your clothes in your colours, before you put them on.</p><button class="btn primary big" data-act="signIn">${I(IC.g)} Sign in with Google</button></div>`;
}

/* ================= overlays ================= */

  const o=S.ov; let h='';
  const en=S.ovNew?' enter':'';
  if(o&&o.t==='picker'){
    const name=G[o.target]||(o.target==='skin'?'Skin colour':'Hair colour');
    h+=`<div class="scrim clear" data-act="ovClose"></div><div class="sheet picker${en}" role="dialog" aria-label="New colour">
      <h3>${G[o.target]?'New colour · '+name:name}</h3>
      <div class="sv" id="sv" style="--h:${o.h}"><div class="knob" id="svk"></div></div>
      <div class="hue" id="hue"><div class="knob" id="huek"></div></div>
      <div><div class="hexrow"><span class="sw" id="pv"></span><input class="inp" id="hex" data-in="hex" value="${o.hex||''}" maxlength="9" spellcheck="false" autocomplete="off" aria-label="Colour code"></div>
      <p class="hint" id="hexhint">A code like #1F3A5F.</p></div>
      <div class="acts2"><button class="btn" data-act="ovClose">Cancel</button><button class="btn primary" id="pickadd" data-act="pickAdd">${G[o.target]?'Add':'Set'}</button></div></div>`;
  }
  if(o&&o.t==='save'){
    const ed=S.editing&&byId(S.editing), full=P.limit==='reached';
    h+=`<div class="scrim" data-act="ovClose"></div><div class="sheet${en}" role="dialog" aria-label="Save look">
      <h3>${ed?'Save changes':'Save look'}</h3>
      <div><label for="lname">Name <span class="soft" style="font-weight:400">(you can leave it empty)</span></label><input class="inp" style="width:100%" id="lname" data-in="lname" value="${esc(o.name)}" placeholder="${esc(M[S.mode].name)}" maxlength="40" autocomplete="off"></div>
      <div><label>Tags</label><div class="tags">${S.tags.map(t=>`<button class="chip${o.tags.includes(t)?' on':''}" data-act="tagToggle" data-arg="${esc(t)}" aria-pressed="${o.tags.includes(t)}">${esc(t)}</button>`).join('')}
        ${o.adding?`<span style="display:inline-flex;gap:6px"><input class="inp" style="height:30px;width:130px;flex:none" id="newtag" data-in="newtag" placeholder="Tag name" maxlength="20" autocomplete="off">${ib('check','newTagDo','Add tag','sm')}</span>`:`<button class="chip" style="border-style:dashed" data-act="newTagOpen">${I(IC.plus,13)} New tag</button>`}</div></div>
      ${full?`<p class="hint bad" style="margin:-6px 0 0">You have 300 looks. That is the limit. Delete one to save a new one.</p>`:''}
      <div class="acts2"><button class="btn" data-act="ovClose">Cancel</button>${ed?`<button class="btn" data-act="saveDo" data-arg="new"${full?' disabled':''}>Save as new</button><button class="btn primary" data-act="saveDo" data-arg="replace">Save changes</button>`:`<button class="btn primary" data-act="saveDo" data-arg="new"${full?' disabled':''}>Save</button>`}</div></div>`;
  }
  if(o&&o.t==='tags'){
    h+=`<div class="scrim" data-act="ovClose"></div><div class="sheet${en}" role="dialog" aria-label="Your tags">
      <div style="display:flex;align-items:center"><h3>Your tags</h3><span style="flex:1"></span>${ib('x','ovClose','Close')}</div>
      <div>${S.tags.length?S.tags.map(t=>{const n=S.looks.filter(l=>l.tags.includes(t)).length;
        return o.ren===t?`<div class="trow"><input class="inp" style="flex:1" id="rentag" data-in="rentag" value="${esc(t)}" maxlength="20" aria-label="New name for ${esc(t)}" autocomplete="off">${ib('check','tagRenDo','Save name','sm')}${ib('x','tagRenStop','Cancel','sm')}</div>`
        :`<div class="trow"><span>${esc(t)}</span><small>${n} ${n===1?'look':'looks'}</small><span class="sp"></span>${ib('pen','tagRen','Rename '+t,'sm',t)}${ib('bin','tagDel','Delete '+t,'sm danger',t)}</div>`}).join(''):'<p class="soft" style="padding:8px 0">No tags yet.</p>'}
      ${o.adding?`<div class="trow" style="border:0"><input class="inp" style="flex:1" id="addtag" data-in="addtag" placeholder="Tag name" maxlength="20" autocomplete="off">${ib('check','tagAddDo','Add tag','sm')}${ib('x','tagAddStop','Cancel','sm')}</div>`
        :`<div class="trow" style="border:0"><button class="btn" data-act="tagAdd">${I(IC.plus,15)} New tag</button></div>`}</div></div>`;
  }
  const c=S.cf;
  if(c) h+=`<div class="scrim" data-act="cfNo" style="z-index:30"></div><div class="sheet${S.cfNew?' enter':''}" role="alertdialog" aria-label="${esc(c.title)}" style="z-index:31"><h3>${esc(c.title)}</h3><p class="sub">${esc(c.body)}</p><div class="acts2"><button class="btn" data-act="cfNo">Cancel</button><button class="btn danger" data-act="cfYes">${esc(c.yes)}</button></div></div>`;
  return h;
}

/* ================= render ================= */
function render(){
  const app=$('#app');
  const theme=P.theme==='device'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):P.theme;
  document.documentElement.dataset.theme=theme;
  const framed=P.screen==='phone'&&innerWidth>=520;
  document.body.classList.toggle('framed',framed);
  narrow=P.screen==='phone'||innerWidth<900;
  app.className=narrow?'narrow':'wide';
  const sc={}; app.querySelectorAll('[data-sc]').forEach(e=>sc[e.dataset.sc]=[e.scrollTop,e.scrollLeft]);
  const act=document.activeElement&&document.activeElement.id;
  if(P.access!=='signed in'){ app.innerHTML=gate()+'<div id="toast" role="status"></div>'; return; }
  const pg=S.page==='dress'?pageDress():S.page==='looks'?pageLooks():S.page==='look'?detail(byId(S.lookId),true):S.page==='compare'?pageCompare():pageSettings();
  const on=p=>(S.page===p||(p==='looks'&&(S.page==='look'||S.page==='compare')))?'on':'';
  const unsaved=S.unsaved?`<div class="unsaved" role="alert"><span>Not saved. Check your internet.</span><span class="sp"></span><button data-act="retry">Retry</button></div>`:'';
  const top=narrow?'':`<div class="top"><span class="word">dressup</span><div class="tnav"><button class="${on('dress')}" data-act="nav" data-arg="dress">${I(IC.shirt,16)} Dress</button><button class="${on('looks')}" data-act="nav" data-arg="looks">${I(IC.grid,16)} Looks</button></div><span class="sp"></span>${ib('gear','settings','Settings',S.page==='settings'?'on':'')}</div>`;
  const nav=narrow?`<div class="nav"><button class="${on('dress')}" data-act="nav" data-arg="dress">${I(IC.shirt,20)}Dress</button><button class="${on('looks')}" data-act="nav" data-arg="looks">${I(IC.grid,20)}Looks</button></div>`:'';
  app.innerHTML=top+`<div class="main">${pg}</div>`+unsaved+nav+overlay()+'<div id="toast" role="status"></div>';
  app.querySelectorAll('[data-sc]').forEach(e=>{const v=sc[e.dataset.sc];if(v){e.scrollTop=v[0];e.scrollLeft=v[1]}});
  if(S.ov&&S.ov.t==='picker') pickerSync(false,true);
  const focusId=S.focus||(S.ovNew&&S.ov&&S.ov.t==='save'&&!narrow?'lname':null)||act;
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();if(S.focus&&el.select)el.select()}}
  S.focus=null;S.ovNew=false;S.cfNew=false;
}

/* ================= colour picker ================= */
function pickerSync(fromInput,skipLive){
  const o=S.ov; if(!o||o.t!=='picker'||!$('#sv')) return;
  $('#sv').style.setProperty('--h',o.h);
  $('#svk').style.left=o.s*100+'%'; $('#svk').style.top=(1-o.v)*100+'%'; $('#svk').style.background=o.hex||'transparent';
  $('#huek').style.left=o.h/360*100+'%'; $('#huek').style.background=`hsl(${o.h} 100% 50%)`;
  $('#pv').style.background=o.hex||'transparent';
  const inp=$('#hex'); if(!fromInput) inp.value=o.hex||'';
  const raw=inp.value, bad=/[^0-9a-f#\s]/i.test(raw)||raw.replace(/[#\s]/g,'').length>6||(o.tried&&!o.hex);
  inp.classList.toggle('bad',bad);
  const hint=$('#hexhint'); hint.classList.toggle('bad',bad);
  hint.textContent=bad?'This is not a colour code. Use 6 letters or numbers, like #1F3A5F.':'A code like #1F3A5F.';
  $('#pickadd').disabled=!o.hex;
  if(!skipLive) live();
}
let liveQ=false;
function live(){
  if(liveQ) return; liveQ=true;
  requestAnimationFrame(()=>{liveQ=false;const o=S.ov;if(!o||o.t!=='picker')return;
    if(G[o.target]){const f=$('#fig');if(f&&P.dress!=='loading')f.innerHTML=dressFig();const hx=$('#hx-'+o.target);if(hx&&o.hex)hx.textContent=o.hex}
    else{const p=$('#prev');if(p)p.innerHTML=figure(['tee_s'],{tee_s:'#F3F1EC'},{vb:'90 20 220 220',lite:true})}});
}
let drag=null;
function dragMove(e){
  const o=S.ov; if(!drag||!o) return;
  const r=drag.el.getBoundingClientRect(); const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  if(drag.k==='sv'){o.s=x;o.v=1-y}else{o.h=Math.min(359.9,x*360)}
  o.hex=hsv2hex(o.h,o.s,o.v);o.tried=false;pickerSync(false);
}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('#sv,#hue');if(!el)return;drag={el,k:el.id};try{el.setPointerCapture(e.pointerId)}catch(_){}dragMove(e);e.preventDefault()});
document.addEventListener('pointermove',e=>{if(drag)dragMove(e)});
document.addEventListener('pointerup',()=>{drag=null});
document.addEventListener('pointercancel',()=>{drag=null});
function openPicker(target,hex){const [h,s,v]=hex2hsv(hex);S.ov={t:'picker',target,h,s,v,hex,tried:false};S.ovNew=true;S.focus=narrow?null:'hex'}

/* ================= actions ================= */
function ask(title,body,yes,fn){S.cf={title,body,yes,fn};S.cfNew=true}
function closeOv(){S.ov=null}
const A={
  nav(p){S.page=p;S.picking=false;S.picked=[];S.ov=null},
  settings(){if(S.page!=='settings')S.prev=S.page==='compare'||S.page==='look'?'looks':S.page;S.page='settings';S.picking=false;S.picked=[]},
  back(){if(S.page==='settings')S.page=S.prev;else{if(S.page==='compare')S.picked=[];S.page='looks'}},
  dressTab(t){S.dressTab=t},
  weather(w){S.weather=w},
  mode(id){S.mode=+id;persist()},
  sw(arg){const [g,c]=arg.split('|');
    if(S.editSq){ if(S.pal[g].length<=1){toast('A row keeps one colour.');return false}
      S.pal[g]=S.pal[g].filter(x=>x!==c); if(S.cur[g]===c)S.cur[g]=S.pal[g][0]; persist(); return }
    S.cur[g]=c;persist()},
  editSq(){S.editSq=!S.editSq},
  jacket(arg){const [g,v]=arg.split('|');S.open[g]=v==='1';persist()},
  addColour(g){openPicker(g,S.cur[g])},
  pickFor(t){openPicker(t,S[t])},
  pickAdd(){const o=S.ov;if(!o||!o.hex){if(o){o.tried=true;pickerSync(true)}return false}
    const hex=normHex(o.hex);
    if(G[o.target]){const g=o.target;
      if(S.pal[g].includes(hex)){S.cur[g]=hex;S.ov=null;render();toast('You have this colour already. It is on now.');persist();return false}
      S.pal[g].unshift(hex);S.cur[g]=hex;S.ov=null;render();persist('Colour added');return false}
    S[o.target]=hex;S.ov=null;render();persist(o.target==='skin'?'Skin colour set':'Hair colour set');return false},
  ovClose(){S.ov=null},
  saveOpen(){const ed=S.editing&&byId(S.editing);S.ov={t:'save',name:ed?ed.name:'',tags:ed?[...ed.tags]:[],adding:false};S.ovNew=true},
  tagToggle(t){const a=S.ov.tags;const i=a.indexOf(t);i<0?a.push(t):a.splice(i,1)},
  newTagOpen(){S.ov.adding=true;S.focus='newtag'},
  newTagDo(){const v=($('#newtag').value||'').trim();if(!v){S.ov.adding=false;return}
    const ex=S.tags.find(t=>t.toLowerCase()===v.toLowerCase());const t=ex||v;if(!ex)S.tags.push(t);if(!S.ov.tags.includes(t))S.ov.tags.push(t);S.ov.adding=false},
  saveDo(kind){const o=S.ov;if(kind!=='replace'&&P.limit==='reached')return false;const items=M[S.mode].items;const colors=Object.fromEntries(items.map(g=>[g,S.cur[g]]));
    const data={name:o.name.trim(),mode:S.mode,colors,tags:[...o.tags],open:Object.assign({},S.open)};
    if(kind==='replace'&&S.editing){Object.assign(byId(S.editing),data);S.sel=S.editing}
    else{const l=Object.assign({id:lookSeq++},data);S.looks.unshift(l);S.sel=l.id}
    S.editing=null;S.stash=null;S.ov=null;render();
    if(P.saving==='fails'){S.unsaved=true;render()}else toast(kind==='replace'?'Changes saved':'Saved to Looks');
    if(P.looks==='empty')StatePanel.set('looks','loaded');
    return false},
  editStop(){if(S.stash){Object.assign(S,S.stash)}S.editing=null;S.stash=null},
  chip(f){S.filter=f},
  openLook(id){id=+id;
    if(S.picking){const i=S.picked.indexOf(id);if(i>=0)S.picked.splice(i,1);else if(S.picked.length>=6){toast('Six looks is the limit.');return false}else S.picked.push(id);return}
    if(narrow){S.page='look';S.lookId=id}else S.sel=id},
  pickStart(){S.picking=true;S.picked=[]},
  pickStop(){S.picking=false;S.picked=[]},
  compareGo(){S.page='compare';S.picking=false},
  lookEdit(id){const l=byId(id);if(!l)return;
    if(!S.editing)S.stash={mode:S.mode,cur:Object.assign({},S.cur),open:Object.assign({},S.open),weather:S.weather};
    S.mode=l.mode;S.weather=M[l.mode].w;Object.assign(S.open,l.open);
    Object.entries(l.colors).forEach(([g,c])=>{S.cur[g]=c;if(!S.pal[g].includes(c))S.pal[g].unshift(c)});
    S.editing=l.id;S.page='dress';S.dressTab='colours'},
  lookDel(id){const l=byId(id);ask('Delete this look?','"'+lookName(l)+'" goes away for good. Your colour squares stay.','Delete',()=>{
    S.looks=S.looks.filter(x=>x.id!==l.id);S.picked=S.picked.filter(x=>x!==l.id);if(S.editing===l.id){S.editing=null;S.stash=null}
    if(S.page==='look')S.page='looks';render();persist('Look deleted')})},
  copy(hex){try{navigator.clipboard&&navigator.clipboard.writeText(hex).catch(()=>{})}catch(_){}toast(hex+' copied');return false},
  tagsOpen(){S.ov={t:'tags',ren:null,adding:false};S.ovNew=true},
  tagRen(t){S.ov.ren=t;S.ov.adding=false;S.focus='rentag'},
  tagRenStop(){S.ov.ren=null},
  tagRenDo(){const old=S.ov.ren,v=($('#rentag').value||'').trim();
    if(!v||v===old){S.ov.ren=null;return}
    if(S.tags.some(t=>t!==old&&t.toLowerCase()===v.toLowerCase())){toast('You have a tag with this name already.');return false}
    S.tags=S.tags.map(t=>t===old?v:t);S.looks.forEach(l=>l.tags=l.tags.map(t=>t===old?v:t));if(S.filter===old)S.filter=v;S.ov.ren=null;persist()},
  tagDel(t){const n=S.looks.filter(l=>l.tags.includes(t)).length;ask('Delete the tag "'+t+'"?',n?`${n} ${n===1?'look loses':'looks lose'} this tag. The looks stay.`:'No look has this tag.','Delete',()=>{
    S.tags=S.tags.filter(x=>x!==t);S.looks.forEach(l=>l.tags=l.tags.filter(x=>x!==t));if(S.filter===t)S.filter='All';render();persist('Tag deleted')})},
  tagAdd(){S.ov.adding=true;S.ov.ren=null;S.focus='addtag'},
  tagAddStop(){S.ov.adding=false},
  tagAddDo(){const v=($('#addtag').value||'').trim();if(!v){S.ov.adding=false;return}
    if(S.tags.some(t=>t.toLowerCase()===v.toLowerCase())){toast('You have a tag with this name already.');return false}
    S.tags.push(v);S.ov.adding=false;persist()},
  accountDel(){ask('Delete your account?','All your looks and colours go away for good. You cannot undo this.','Delete my account',()=>{S.page='dress';StatePanel.set('access','signed out');toast('Account deleted')})},
  signIn(){StatePanel.set('access','signed in');return false},
  signOut(){S.page='dress';StatePanel.set('access','signed out');return false},
  otherAccount(){StatePanel.set('access','signed out');return false},
  retry(){if(P.saving==='fails'){toast('Still no connection.');return false}S.unsaved=false;render();toast('Saved');return false},
  cfNo(){S.cf=null},
  cfYes(){const f=S.cf.fn;S.cf=null;f();return false}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const f=A[b.dataset.act]; if(!f) return;
  if(f(b.dataset.arg,b)!==false){ render(); if(S.keep!=null){const el=$('#email');if(el)el.value=S.keep;S.keep=null} }
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.in; if(!k) return;
  if(k==='hex'){const o=S.ov;const n=normHex(e.target.value);o.tried=false;if(n){o.hex=n;[o.h,o.s,o.v]=hex2hsv(n)}else o.hex=null;pickerSync(true)}
  else if(k==='lname'){S.ov.name=e.target.value}
  else if(k==='email'&&S.emailErr){S.emailErr='';e.target.classList.remove('bad');const h=$('#emailhint');h.classList.remove('bad');h.textContent='Only people on this list can sign in.'}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.cf){S.cf=null;render()} else if(S.ov){S.ov=null;render()} else if(S.picking){S.picking=false;S.picked=[];render()} return }
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.in){
    const map={hex:'pickAdd',lname:'saveDo',newtag:'newTagDo',rentag:'tagRenDo',addtag:'tagAddDo'};
    const k=e.target.dataset.in, act=map[k]; if(!act) return; e.preventDefault();
    const arg=k==='lname'?(S.editing?'replace':'new'):undefined;
    if(A[act](arg)!==false){ render(); if(S.keep!=null){const el=$('#email');if(el)el.value=S.keep;S.keep=null} }
  }
});
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,120)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);

StatePanel.init({
  title:'dressup states',
  rows:[
    {id:'access',label:'Access',options:['signed in','signed out','sign-ups closed']},
    {id:'dress',label:'Dress page',options:['loaded','loading']},
    {id:'looks',label:'Looks page',options:['loaded','loading','empty']},
    {id:'saving',label:'Saving',options:['works','fails']},
    {id:'limit',label:'Looks limit (300)',options:['under','reached']},
    {id:'theme',label:'Theme',options:['device','light','dark']},
    {id:'screen',label:'Screen',options:['auto','phone']}
  ],
  onChange(st){P=st;render()}
});
</script>
</body></html>
